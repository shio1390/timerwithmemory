<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="60分タイマー">
<title>60分カウントアップタイマー</title>
<style>
  /* レイアウト: タイマー画面は中央に大きな円、記録画面は上から縦に並ぶカード一覧 */
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --track: #dde4ea;
    --ink: #1d2733;
    --muted: #5d6b79;
    --accent: #d23f25;
    --accent-ink: #ffffff;
    --line: #9aa8b5;
    --danger: #b3261e;
    --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171c;
      --card: #1c242c;
      --track: #232c35;
      --ink: #e8edf1;
      --muted: #9aa8b5;
      --accent: #ff7a5c;
      --accent-ink: #1a0f0c;
      --line: #5d6b79;
      --danger: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171c;
    --card: #1c242c;
    --track: #232c35;
    --ink: #e8edf1;
    --muted: #9aa8b5;
    --accent: #ff7a5c;
    --accent-ink: #1a0f0c;
    --line: #5d6b79;
    --danger: #ff8a80;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .screen {
    min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  #view-timer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    user-select: none;
    -webkit-user-select: none;
  }
  #view-records { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  button, input, select { font: inherit; color: inherit; }
  button {
    font-size: 18px;
    font-weight: 700;
    min-height: 52px;
    border-radius: 14px;
    border: 2px solid transparent;
    cursor: pointer;
    background: transparent;
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: default; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-sub { background: var(--card); color: var(--ink); border-color: var(--line); }

  .topbar { width: min(92vw, 440px); display: flex; justify-content: flex-end; }
  .topbar button { min-height: 46px; padding: 0 18px; font-size: 16px; }

  svg { width: min(88vw, 46vh, 400px); height: auto; display: block; }
  .track { fill: var(--track); }
  .fill  { fill: var(--accent); }
  .tick  { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
  .num   { fill: var(--muted); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .readout { text-align: center; }
  .time {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .time:active { opacity: 0.7; }
  .time:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #tMain { font-size: 56px; }
  .time .ms {
    display: inline-block;
    width: 2.5em; /* 幅を固定して、数字が変わっても全体が揺れないようにする */
    margin-left: 2px;
    text-align: left;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--muted);
  }
  .time.masked #tMain { color: var(--muted); letter-spacing: 0.12em; }
  .hint { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .status { margin-top: 4px; min-height: 1.4em; font-size: 15px; color: var(--muted); }

  .buttons { width: min(92vw, 440px); display: flex; gap: 12px; }
  #main { flex: 1 1 auto; min-height: 60px; font-size: 20px; }
  #reset { flex: 0 0 auto; padding: 0 20px; font-size: 16px; min-height: 60px; }
  #reset.armed { border-color: var(--danger); color: var(--danger); }

  .panel {
    width: min(92vw, 440px);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 17px; }
  label { font-size: 14px; color: var(--muted); font-weight: 600; }
  input[type="text"], input[type="search"], input[type="date"], select {
    width: 100%;
    min-height: 50px;
    font-size: 17px; /* 16px未満だとiPhoneで入力時に拡大される */
    padding: 0 12px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--bg);
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  .warn { margin: 0; font-size: 13px; color: var(--danger); }
  #saveBtn { margin-top: 6px; min-height: 56px; }

  /* 記録画面 */
  .rec-head { display: flex; align-items: center; gap: 12px; }
  .rec-head h1 { margin: 0; font-size: 24px; }
  .rec-head button { min-height: 46px; padding: 0 16px; font-size: 16px; }
  .controls { display: grid; gap: 10px; }
  .count { font-size: 14px; color: var(--muted); margin: 0; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .rec {
    background: var(--card);
    border: 2px solid var(--track);
    border-radius: 14px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
    align-items: center;
  }
  .rec-title { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .rec-title.none { color: var(--muted); font-weight: 500; }
  .rec-time { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .rec-date { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rec-del { min-height: 40px; padding: 0 12px; font-size: 14px; color: var(--muted); justify-self: end; border-color: var(--track); }
  .rec-del.armed { color: var(--danger); border-color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; line-height: 1.7; margin: 0; }
  #copyBtn { font-size: 15px; min-height: 48px; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: 90vw;
    background: var(--ink);
    color: var(--bg);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    z-index: 10;
    text-align: center;
  }
</style>
</head>
<body>

<main id="view-timer" class="screen">
  <div class="topbar">
    <button id="toRecords" class="btn-sub" type="button">記録（<span id="recCount">0</span>）</button>
  </div>

  <svg id="face" viewBox="0 0 400 400" role="img" aria-label="60分で一周する円形タイマー">
    <circle class="track" cx="200" cy="200" r="140"></circle>
    <path id="sector" class="fill" d=""></path>
    <g id="ticks"></g>
  </svg>

  <div class="readout">
    <div class="time" id="time" role="button" tabindex="0"><span id="tMain">00:00</span><span class="ms" id="tMs">.000</span></div>
    <div class="status" id="status"></div>
    <div class="hint" id="hint">数字をタップすると、表示・非表示を切り替えられます</div>
  </div>

  <div class="buttons">
    <button id="main" class="btn-primary" type="button">スタート！</button>
    <button id="reset" class="btn-sub" type="button">リセット</button>
  </div>

  <section id="savePanel" class="panel" hidden aria-labelledby="saveHead">
    <h2 id="saveHead">この時間を保存する</h2>
    <label for="titleIn">タイトル</label>
    <input id="titleIn" type="text" maxlength="60" placeholder="例：ゆで卵、ピアノの練習" autocomplete="off">
    <label for="dateIn">日付</label>
    <input id="dateIn" type="date">
    <p id="noStorage" class="warn" hidden>この環境では端末に保存できません。保存しても、このページを閉じると消えます。</p>
    <button id="saveBtn" class="btn-primary" type="button">保存する</button>
  </section>
</main>

<main id="view-records" class="screen" hidden>
  <div class="rec-head">
    <button id="toTimer" class="btn-sub" type="button">← タイマー</button>
    <h1>記録</h1>
  </div>

  <div class="controls">
    <div>
      <label for="searchIn">タイトルで検索</label>
      <input id="searchIn" type="search" placeholder="タイトルの一部を入力" autocomplete="off">
    </div>
    <div>
      <label for="sortSel">並べ替え</label>
      <select id="sortSel">
        <option value="date-desc">日付が新しい順</option>
        <option value="date-asc">日付が古い順</option>
        <option value="sec-desc">時間が長い順</option>
        <option value="sec-asc">時間が短い順</option>
        <option value="title-asc">タイトル順（あいうえお）</option>
      </select>
    </div>
  </div>

  <p id="count" class="count"></p>
  <p id="noStorage2" class="warn" hidden>この環境では端末に保存できません。記録はこのページを閉じると消えます。</p>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden></p>

  <button id="copyBtn" class="btn-sub" type="button">表示中の記録をコピー（表計算に貼り付け用）</button>
  <p id="offlineStat" class="count" role="status"></p>
</main>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  var TOTAL = 60 * 60; // 秒
  var TOTAL_MS = TOTAL * 1000;
  var TICK_MS = 100; // 画面の更新間隔（ミリ秒表示はこの間隔で動く）
  var CX = 200, CY = 200, R = 140;
  var NS = 'http://www.w3.org/2000/svg';
  var KEY_REC = 'timerRecords.v1';
  var KEY_ST = 'timerState.v1';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function pad3(n) { return n < 10 ? '00' + n : (n < 100 ? '0' + n : String(n)); }

  /* ---------- 端末保存（localStorage） ---------- */
  var storageOK = false;
  try { localStorage.setItem('timer.__t', '1'); localStorage.removeItem('timer.__t'); storageOK = true; } catch (e) {}
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  // 表示の設定（数字を隠すかどうか）
  var KEY_PREF = 'timerPrefs.v1';
  var hideTime = false;
  try { var pf = JSON.parse(lsGet(KEY_PREF) || '{}'); hideTime = pf && pf.hideTime === true; } catch (e) {}

  var records = [];
  (function () {
    try {
      var raw = lsGet(KEY_REC);
      var arr = raw ? JSON.parse(raw) : [];
      if (Array.isArray(arr)) {
        records = arr.filter(function (r) {
          return r && typeof r.sec === 'number' && typeof r.date === 'string';
        }).map(function (r) {
          return { id: String(r.id || ''), title: String(r.title || ''), date: r.date, sec: r.sec, savedAt: Number(r.savedAt) || 0 };
        });
      }
    } catch (e) { records = []; }
  })();
  function persistRecords() { return lsSet(KEY_REC, JSON.stringify(records)); }

  /* ---------- 画面の部品 ---------- */
  var elSector = $('sector'), elTime = $('time'), elStatus = $('status');
  var elMain = $('tMain'), elMs = $('tMs'), elHint = $('hint');
  var btnMain = $('main'), btnReset = $('reset');
  var panel = $('savePanel'), titleIn = $('titleIn'), dateIn = $('dateIn'), saveBtn = $('saveBtn');
  $('noStorage').hidden = storageOK;
  $('noStorage2').hidden = storageOK;

  // 5分ごとの目盛りと数字
  var ticks = $('ticks');
  for (var i = 0; i < 12; i++) {
    var a = (i / 12) * 2 * Math.PI, s = Math.sin(a), c = Math.cos(a);
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('class', 'tick');
    line.setAttribute('x1', (CX + 150 * s).toFixed(2));
    line.setAttribute('y1', (CY - 150 * c).toFixed(2));
    line.setAttribute('x2', (CX + 164 * s).toFixed(2));
    line.setAttribute('y2', (CY - 164 * c).toFixed(2));
    ticks.appendChild(line);
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'num');
    t.setAttribute('x', (CX + 183 * s).toFixed(2));
    t.setAttribute('y', (CY - 183 * c).toFixed(2));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.textContent = String(i * 5);
    ticks.appendChild(t);
  }

  function sectorPath(frac) {
    if (frac <= 0) return '';
    if (frac >= 1) {
      return 'M' + CX + ' ' + (CY - R) + ' A' + R + ' ' + R + ' 0 1 1 ' + CX + ' ' + (CY + R) +
             ' A' + R + ' ' + R + ' 0 1 1 ' + CX + ' ' + (CY - R) + ' Z';
    }
    var ang = frac * 2 * Math.PI;
    var x = CX + R * Math.sin(ang), y = CY - R * Math.cos(ang);
    return 'M' + CX + ' ' + CY + ' L' + CX + ' ' + (CY - R) +
           ' A' + R + ' ' + R + ' 0 ' + (frac > 0.5 ? 1 : 0) + ' 1 ' + x.toFixed(3) + ' ' + y.toFixed(3) + ' Z';
  }

  /* ---------- 表示用の整形 ---------- */
  function fmtClock(sec) { return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
  function fmtDur(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m === 0) return s + '秒';
    return m + '分' + pad(s) + '秒';
  }
  function fmtDate(str) {
    var p = String(str).split('-');
    if (p.length !== 3) return str;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(d.getTime())) return str;
    return p[0] + '/' + pad(+p[1]) + '/' + pad(+p[2]) + '（' + WD[d.getDay()] + '）';
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2400);
  }

  /* ---------- タイマー本体 ---------- */
  var elapsed = 0;       // 停止までに積み上げた時間(ms)
  var startedAt = null;  // 計測中の開始時刻(Date.now)
  var state = 'idle';    // idle / running / stopped / done
  var timerId = null;
  var wakeLock = null;

  function currentMs() { return elapsed + (startedAt !== null ? Date.now() - startedAt : 0); }
  function persistState() { lsSet(KEY_ST, JSON.stringify({ state: state, elapsed: elapsed, startedAt: startedAt })); }

  function render() {
    var ms = currentMs();
    if (ms >= TOTAL_MS) { ms = TOTAL_MS; if (state === 'running') finish(); }
    elSector.setAttribute('d', sectorPath(ms / TOTAL_MS));
    // 数字を隠す設定でも、ストップ後と60分到達後は、保存前に確認できるよう表示する
    var shown = !hideTime || state === 'stopped' || state === 'done';
    elMain.textContent = shown ? fmtClock(Math.floor(ms / 1000)) : '••:••';
    elMs.textContent = shown ? '.' + pad3(Math.floor(ms % 1000)) : '•••';
    elTime.classList.toggle('masked', !shown);
  }

  function setUI() {
    var showPanel = state === 'stopped' || state === 'done';
    panel.hidden = !showPanel;
    elHint.hidden = state !== 'idle';
    if (state === 'idle') {
      btnMain.textContent = 'スタート！'; btnMain.disabled = false;
      elStatus.textContent = 'スタートを押すと計測を始めます';
    } else if (state === 'running') {
      btnMain.textContent = 'ストップ'; btnMain.disabled = false;
      elStatus.textContent = '計測中';
    } else if (state === 'stopped') {
      btnMain.textContent = '再開'; btnMain.disabled = false;
      elStatus.textContent = 'ストップしました。保存できます';
    } else {
      btnMain.textContent = '60分 おわり'; btnMain.disabled = true;
      elStatus.textContent = '一周しました。保存できます';
    }
  }

  function requestWake() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) {
          wakeLock = l;
          l.addEventListener('release', function () { wakeLock = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  function stopTick() { clearInterval(timerId); timerId = null; }

  function start() {
    startedAt = Date.now();
    state = 'running';
    if (timerId === null) timerId = setInterval(render, TICK_MS);
    requestWake();
    persistState(); setUI(); render();
  }
  function stop() {
    elapsed = Math.min(currentMs(), TOTAL_MS);
    startedAt = null;
    state = 'stopped';
    stopTick(); releaseWake();
    dateIn.value = todayStr();
    persistState(); setUI(); render();
    try { panel.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  function finish() {
    elapsed = TOTAL_MS;
    startedAt = null;
    state = 'done';
    stopTick(); releaseWake();
    if (!dateIn.value) dateIn.value = todayStr();
    persistState(); setUI();
  }
  function resetCore() {
    elapsed = 0; startedAt = null; state = 'idle';
    stopTick(); releaseWake();
    titleIn.value = '';
    persistState(); setUI(); render();
  }

  // リセットは、計測した時間が消えてしまうので2回押しで実行
  var resetArmTimer = null;
  function disarmReset() {
    clearTimeout(resetArmTimer);
    btnReset.classList.remove('armed');
    btnReset.textContent = 'リセット';
  }
  // 数字そのものをタップして、表示と非表示を切り替える
  function updateTimeAria() {
    elTime.setAttribute('aria-label', hideTime ? '経過時間は非表示です。押すと表示します' : '経過時間。押すと隠します');
  }
  function toggleTime() {
    hideTime = !hideTime;
    lsSet(KEY_PREF, JSON.stringify({ hideTime: hideTime }));
    updateTimeAria();
    render();
    if (state === 'stopped' || state === 'done') {
      toast(hideTime ? '次の計測から数字を隠します' : '次の計測から数字を表示します');
    }
  }
  elTime.addEventListener('click', toggleTime);
  elTime.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTime(); }
  });

  btnReset.addEventListener('click', function () {
    if (state !== 'idle' && currentMs() >= 1000 && !btnReset.classList.contains('armed')) {
      btnReset.classList.add('armed');
      btnReset.textContent = '破棄する？';
      resetArmTimer = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    resetCore();
  });

  btnMain.addEventListener('click', function () {
    disarmReset();
    if (state === 'idle' || state === 'stopped') start();
    else if (state === 'running') stop();
  });

  saveBtn.addEventListener('click', function () {
    if (state !== 'stopped' && state !== 'done') return;
    var sec = Math.min(Math.floor(currentMs() / 1000), TOTAL);
    var rec = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: titleIn.value.trim(),
      date: dateIn.value || todayStr(),
      sec: sec,
      savedAt: Date.now()
    };
    records.unshift(rec);
    if (!persistRecords() && storageOK) {
      records.shift();
      toast('保存できませんでした。もう一度お試しください');
      return;
    }
    updateCount();
    resetCore();
    toast(storageOK ? '保存しました：' + fmtDur(sec) : '一時的に記録しました（この環境では端末に残りません）');
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state === 'running') { render(); requestWake(); }
  });

  // 前回の状態を復元（ページを開き直しても計測を続けられる）
  (function () {
    var raw = lsGet(KEY_ST);
    if (!raw) return;
    try {
      var st = JSON.parse(raw);
      if (!st || typeof st.elapsed !== 'number') return;
      elapsed = Math.max(0, Math.min(st.elapsed, TOTAL_MS));
      if (st.state === 'running' && typeof st.startedAt === 'number' && st.startedAt <= Date.now()) {
        startedAt = st.startedAt; state = 'running';
        timerId = setInterval(render, TICK_MS);
      } else if (st.state === 'stopped' || st.state === 'done') {
        state = st.state;
        dateIn.value = todayStr();
      } else {
        elapsed = 0;
      }
    } catch (e) { elapsed = 0; startedAt = null; state = 'idle'; }
  })();

  /* ---------- 記録画面 ---------- */
  function norm(str) {
    var s = String(str || '');
    try { s = s.normalize('NFKC'); } catch (e) {}
    s = s.toLowerCase();
    // カタカナをひらがなにそろえる（「ぴあの」で「ピアノ」も見つかる）
    return s.replace(/[ァ-ヶ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); });
  }
  function cmpDate(a, b) {
    if (a.date < b.date) return -1;
    if (a.date > b.date) return 1;
    return (a.savedAt || 0) - (b.savedAt || 0);
  }
  var SORTS = {
    'date-desc': function (a, b) { return -cmpDate(a, b); },
    'date-asc':  function (a, b) { return cmpDate(a, b); },
    'sec-desc':  function (a, b) { return (b.sec - a.sec) || -cmpDate(a, b); },
    'sec-asc':   function (a, b) { return (a.sec - b.sec) || -cmpDate(a, b); },
    'title-asc': function (a, b) {
      var ea = !a.title, eb = !b.title;
      if (ea !== eb) return ea ? 1 : -1; // タイトルなしは最後
      return a.title.localeCompare(b.title, 'ja') || -cmpDate(a, b);
    }
  };
  function visibleRecords() {
    var q = norm($('searchIn').value.trim());
    var list = records.filter(function (r) { return !q || norm(r.title).indexOf(q) !== -1; });
    var fn = SORTS[$('sortSel').value] || SORTS['date-desc'];
    return list.slice().sort(fn);
  }
  function updateCount() { $('recCount').textContent = String(records.length); }

  function renderRecords() {
    var list = visibleRecords();
    var ul = $('list');
    while (ul.firstChild) ul.removeChild(ul.firstChild);

    var filtering = $('searchIn').value.trim() !== '';
    $('count').textContent = filtering ? records.length + '件中 ' + list.length + '件' : '全' + records.length + '件';
    var empty = $('empty');
    if (list.length === 0) {
      empty.hidden = false;
      empty.textContent = records.length === 0
        ? 'まだ記録がありません。タイマーをストップすると、ここに保存できます。'
        : '「' + $('searchIn').value.trim() + '」に合う記録はありません。';
    } else {
      empty.hidden = true;
    }
    $('copyBtn').disabled = list.length === 0;

    list.forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'rec';

      var ti = document.createElement('div');
      ti.className = 'rec-title' + (r.title ? '' : ' none');
      ti.textContent = r.title || '（タイトルなし）';

      var tm = document.createElement('div');
      tm.className = 'rec-time';
      tm.textContent = fmtDur(r.sec);

      var dt = document.createElement('div');
      dt.className = 'rec-date';
      dt.textContent = fmtDate(r.date);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'rec-del';
      del.textContent = '削除';
      var armTimer = null;
      del.addEventListener('click', function () {
        if (!del.classList.contains('armed')) {
          del.classList.add('armed');
          del.textContent = '本当に削除';
          armTimer = setTimeout(function () { del.classList.remove('armed'); del.textContent = '削除'; }, 3000);
          return;
        }
        clearTimeout(armTimer);
        records = records.filter(function (x) { return x.id !== r.id; });
        persistRecords();
        updateCount();
        renderRecords();
        toast('削除しました');
      });

      li.appendChild(ti); li.appendChild(tm); li.appendChild(dt); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  $('searchIn').addEventListener('input', renderRecords);
  $('sortSel').addEventListener('change', renderRecords);

  $('copyBtn').addEventListener('click', function () {
    var rows = ['日付\tタイトル\t秒\t時間'];
    visibleRecords().forEach(function (r) {
      rows.push([r.date, r.title.replace(/[\t\r\n]+/g, ' '), r.sec, fmtClock(r.sec)].join('\t'));
    });
    var text = rows.join('\n');
    try {
      navigator.clipboard.writeText(text).then(
        function () { toast('コピーしました'); },
        function () { toast('コピーできませんでした'); }
      );
    } catch (e) { toast('コピーできませんでした'); }
  });

  /* ---------- 画面の切り替え（#records / #timer） ---------- */
  var view = 'timer';
  function showView(name) {
    if (name === view) return;
    view = name;
    $('view-timer').hidden = name !== 'timer';
    $('view-records').hidden = name !== 'records';
    if (name === 'records') renderRecords();
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function go(name) {
    showView(name);
    try { location.hash = name; } catch (e) {}
  }
  $('toRecords').addEventListener('click', function () { go('records'); });
  $('toTimer').addEventListener('click', function () { go('timer'); });
  window.addEventListener('hashchange', function () {
    showView(location.hash === '#records' ? 'records' : 'timer');
  });

  /* ---------- オフライン対応（Service Worker） ---------- */
  (function () {
    var stat = $('offlineStat');
    function say(t) { stat.textContent = 'オフライン対応：' + t; }
    var secure = location.protocol === 'https:' || location.hostname === 'localhost';
    if (!('serviceWorker' in navigator) || !secure) { say('この環境では使えません'); return; }
    say('準備中…');
    try {
      navigator.serviceWorker.register('sw.js')
        .then(function () { return navigator.serviceWorker.ready; })
        .then(function () { say('準備できました（通信なしでも起動できます）'); })
        .catch(function () { say('準備できませんでした'); });
    } catch (e) { say('この環境では使えません'); }
  })();

  /* ---------- 起動 ---------- */
  updateCount();
  updateTimeAria();
  setUI();
  render();
  if (location.hash === '#records') showView('records');
})();
</script>
</body>
</html>
